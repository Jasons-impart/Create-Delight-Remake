<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="机械动力：齿轮盛宴模组分类浏览页。">
  <link rel="icon" href="../icon.png">
  <title>模组分类浏览 - 机械动力：齿轮盛宴</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --surface: #171b1f;
      --surface-2: #20252b;
      --text: #f4f0e8;
      --muted: #c5bdae;
      --line: #3b342b;
      --accent: #e7a83a;
      --blue: #7dd3fc;
      --green: #89d185;
      --red: #ef8f7e;
      --violet: #c9a7ff;
      --teal: #65d6c5;
      --pink: #f0a3c0;
      --orange: #f0b45c;
      --lime: #b5d96a;
      --cyan: #8bd9e8;
      --indigo: #9fb5ff;
      --gray: #9ca3af;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(16, 18, 20, .66), #101214 360px),
        url("../kubejs/assets/createdelight/textures/images_for_readme/introduction.png") top center / cover no-repeat;
      color: var(--text);
      font-family: "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      line-height: 1.6;
    }

    a {
      color: var(--blue);
      text-underline-offset: 3px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .page {
      width: min(1240px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand img {
      width: 178px;
      max-width: 38vw;
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .45));
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 2.4vw, 2.55rem);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subline {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: .95rem;
    }

    .back {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 8px 13px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 6px;
      background: rgba(23, 27, 31, .78);
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(160px, 220px) minmax(130px, 180px);
      gap: 12px;
      margin-bottom: 18px;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      background: rgba(16, 18, 20, .78);
      backdrop-filter: blur(8px);
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field span {
      color: var(--muted);
      font-size: .82rem;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 40px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      padding: 8px 10px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      min-height: 76px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      background: rgba(23, 27, 31, .84);
      padding: 12px 14px;
    }

    .stat strong {
      display: block;
      font-size: 1.7rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .stat span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: .88rem;
    }

    .section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin: 22px 0 12px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 1.24rem;
      letter-spacing: 0;
    }

    .section-title p {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .category-card {
      min-height: 148px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 8px;
      width: 100%;
      border: 1px solid color-mix(in srgb, var(--tone), transparent 46%);
      border-radius: 8px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--tone), transparent 88%), rgba(23, 27, 31, .92));
      color: var(--text);
      text-align: left;
      padding: 14px;
      cursor: pointer;
    }

    .category-card[aria-pressed="true"] {
      outline: 2px solid var(--tone);
      outline-offset: 2px;
    }

    .category-top {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 10px;
    }

    .category-name {
      font-weight: 700;
      line-height: 1.25;
    }

    .category-count {
      flex: 0 0 auto;
      min-width: 44px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--tone), transparent 76%);
      text-align: center;
      padding: 2px 8px;
      font-weight: 700;
    }

    .category-card p {
      margin: 0;
      color: var(--muted);
      font-size: .85rem;
    }

    .category-examples {
      align-self: end;
      color: var(--muted);
      font-size: .82rem;
    }

    .list-panel {
      margin-top: 18px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 8px;
      background: rgba(20, 23, 26, .9);
      box-shadow: 0 18px 45px rgba(0, 0, 0, .22);
      overflow: hidden;
    }

    .list-head {
      display: grid;
      gap: 8px;
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, .1);
      background: rgba(23, 27, 31, .92);
    }

    .list-head h2 {
      margin: 0;
      font-size: 1.22rem;
      letter-spacing: 0;
    }

    .summary-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 999px;
      background: rgba(255, 255, 255, .05);
      color: var(--muted);
      padding: 2px 8px;
      font-size: .82rem;
    }

    .groups {
      display: grid;
      gap: 0;
    }

    .group {
      border-bottom: 1px solid rgba(255, 255, 255, .1);
    }

    .group:last-child {
      border-bottom: 0;
    }

    .group-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 16px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--tone), transparent 86%), transparent);
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }

    .group-title h3 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0;
    }

    .mod-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0;
    }

    .mod-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      min-height: 74px;
      padding: 12px 16px;
      border-right: 1px solid rgba(255, 255, 255, .08);
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }

    .mod-item strong {
      display: block;
      overflow-wrap: anywhere;
      line-height: 1.3;
    }

    .mod-item code {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: .78rem;
      overflow-wrap: anywhere;
    }

    .side {
      align-self: start;
      min-width: 54px;
      border-radius: 999px;
      text-align: center;
      padding: 2px 8px;
      font-size: .78rem;
      font-weight: 700;
    }

    .side.both {
      background: rgba(137, 209, 133, .16);
      color: var(--green);
    }

    .side.client {
      background: rgba(125, 211, 252, .15);
      color: var(--blue);
    }

    .side.server {
      background: rgba(239, 143, 126, .15);
      color: var(--red);
    }

    .empty {
      padding: 32px 16px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 1080px) {
      .category-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 780px) {
      .page {
        width: min(100% - 22px, 1240px);
        padding-top: 18px;
      }

      .topbar,
      .section-title {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar,
      .stats,
      .category-grid,
      .mod-grid {
        grid-template-columns: 1fr;
      }

      .brand {
        align-items: flex-start;
        flex-direction: column;
      }

      .brand img {
        max-width: 230px;
        width: 58vw;
      }

      .back {
        width: 100%;
        text-align: center;
      }

      .category-card {
        min-height: 128px;
      }

      .mod-item {
        grid-template-columns: 1fr;
        border-right: 0;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <img src="../kubejs/assets/createdelight/textures/images_for_readme/title.png" alt="机械动力：齿轮盛宴">
        <div>
          <h1>模组分类浏览</h1>
          <p class="subline" id="dataSummary">读取模组清单中</p>
        </div>
      </div>
      <a class="back" href="../">返回首页</a>
    </header>

    <section class="toolbar" aria-label="筛选模组">
      <label class="field">
        <span>搜索</span>
        <input id="searchInput" type="search" placeholder="输入模组名、文件名或分类">
      </label>
      <label class="field">
        <span>分类</span>
        <select id="categorySelect"></select>
      </label>
      <label class="field">
        <span>端侧</span>
        <select id="sideSelect">
          <option value="all">全部</option>
          <option value="both">双端</option>
          <option value="client">客户端</option>
          <option value="server">服务端</option>
        </select>
      </label>
    </section>

    <section class="stats" aria-label="模组统计">
      <div class="stat"><strong id="totalCount">0</strong><span>当前结果</span></div>
      <div class="stat"><strong id="categoryCount">0</strong><span>分类</span></div>
      <div class="stat"><strong id="bothCount">0</strong><span>双端模组</span></div>
      <div class="stat"><strong id="clientCount">0</strong><span>客户端模组</span></div>
    </section>

    <section class="section-title">
      <div>
        <h2>分类总览</h2>
        <p>点击分类卡片可聚焦查看该类模组；再次点击返回全部。</p>
      </div>
      <p id="filterSummary">全部分类</p>
    </section>

    <section class="category-grid" id="categoryGrid" aria-label="模组分类"></section>

    <main class="list-panel" aria-live="polite">
      <div class="list-head">
        <h2 id="listTitle">全部模组</h2>
        <div class="summary-line" id="summaryLine"></div>
      </div>
      <div class="groups" id="groups"></div>
    </main>
  </div>

  <script src="./mods-data.js"></script>
  <script>
    const mods = Array.isArray(window.CDR_MODS) ? window.CDR_MODS : [];
    const categories = [
      {
        key: "create",
        label: "机械动力与自动化",
        tone: "var(--accent)",
        description: "Create 本体、附属、动力网络、序列装配与自动化扩展。",
        pattern: /create|contraption|steam|railways|crafts|kinetic|mechanical|slice|sequenced pattern|cobblefordays|industrial platform|vintage/i
      },
      {
        key: "storage",
        label: "存储、物流与 AE2",
        tone: "var(--blue)",
        description: "AE2、存储抽屉、背包、终端与物流网络。",
        pattern: /applied|energistics|ae2|storage|drawer|backpack|sophisticated|functional|logistic|terminal|cell|omni|network analyser|cable|laser|pipe|refined|inventory connector/i
      },
      {
        key: "food",
        label: "农业、料理与生态",
        tone: "var(--green)",
        description: "农夫乐事、季节、食物、饮品、农作物与生态内容。",
        pattern: /delight|farmer|food|cooking|brew|vinery|bakery|bakeries|beachparty|candlelight|herbal|crop|season|spice|apple|farm|aquaculture|fruits|vegetable|butcher|coffee|tea|corn|cuisine|nourish|youkai|ecologics|neapolitan|collectorsreap|cosmopolitan|festival|always.?eat/i
      },
      {
        key: "world",
        label: "世界、维度与结构",
        tone: "var(--teal)",
        description: "地形、群系、洞穴、维度、村庄、结构和传送探索。",
        pattern: /biome|terralith|tectonic|yung|dungeon|structure|village|town|tower|cave|caves|alex|ad astra|twilight|deeper|deeperdarker|repurposed|incendium|nether|end|explor|lost|sky|realm|mineshaft|fortress|stronghold|waystone|waystones|bumblezone|gateways|natures.?compass|portal|lithostitched/i
      },
      {
        key: "combat",
        label: "战斗、装备与成长",
        tone: "var(--red)",
        description: "武器、护甲、枪械、Tetra、附魔、怪物和成长系统。",
        pattern: /combat|weapon|armor|armour|tetra|tacz|gun|guns|apotheosis|apothic|attributes|enchant|boss|mobs|mutant|guard|loot|relic|curios|accessor|trinket|paraglider|health|damage|level|skill|spell|ars|magic|gobber|hearts|dreadsteel|dragons|dummy|soul fire|elytra slot|simple hats/i
      },
      {
        key: "quest",
        label: "任务、指南与信息",
        tone: "var(--violet)",
        description: "任务书、配方查看、探针、进度、提示与信息覆盖层。",
        pattern: /quest|ftb|jei|emi|jade|probe|tooltip|loot info|advancement|guide|catalogue|configured|search|recipe|enchantment descriptions|patchouli|manual|map atlas|wthit|one enough|observable|just enough|jeed|meed|holo|pick up notifier|item borders|itemphysic/i
      },
      {
        key: "visual",
        label: "视觉、音效与沉浸",
        tone: "var(--pink)",
        description: "渲染、光影、音效、动画、镜头和沉浸式表现。",
        pattern: /oculus|embeddium|rubidium|shader|iris|sound|audio|visual|animation|camera|skin|player animator|presence|ambient|dynamic lights|particle|sparkle|blur|fancymenu|fancy|drippy|panorama|resourceful|presence footsteps|smooth|colorwheel|lucent|net music|shoulder surfing|screenshot|immersive aircraft|aircraft|many planes/i
      },
      {
        key: "building",
        label: "建筑、装饰与方块扩展",
        tone: "var(--orange)",
        description: "家具、装饰、方块变体、建筑工具和细节补充。",
        pattern: /macaw|furniture|decor|decoration|supplementaries|amendments|chisel|framed|block|builders|building|construction|handcrafted|architect|roof|window|door|trapdoor|every compat|rechiseled|copycats|beautify|another furniture|adorn|paint|sculpt|quark|torchmaster|comforts|carry on/i
      },
      {
        key: "ui",
        label: "界面、地图与操作体验",
        tone: "var(--cyan)",
        description: "快捷键、HUD、地图、小地图、物品栏和操作便利性。",
        pattern: /mouse|controlling|key|inventory|hotbar|menu|hud|ui|gui|map|xaero|journey|minimap|zoom|apple.?skin|better f3|toast|plaque|chat|mod menu|skin layers|tips|equipment compare|crosshair|account switcher|lan world|resourcify|trade refresh/i
      },
      {
        key: "economy",
        label: "经济、社交与整合包定制",
        tone: "var(--lime)",
        description: "货币、任务奖励、反馈、整合包脚本扩展和定制内容。",
        pattern: /currency|lightman|bountiful|stamp|album|hotai|general feedback|powerfuljs|morejs|moestweaks|central|kaleidoscope|glodium|harium|icterine|jupiter|flerovium|botarium|simple backups|remove stardust/i
      },
      {
        key: "performance",
        label: "性能、修复与兼容",
        tone: "var(--indigo)",
        description: "性能优化、内存修复、网络修复、兼容补丁和调试工具。",
        pattern: /performance|fast|ferrite|modernfix|memory|leak|spark|canary|radium|lithium|starlight|fix|bug|patch|fps|clumps|connectivity|packet|better chunk|async|smooth boot|lightspeed|mixin|saturn|immediatelyfast|accelerated|dynamic fps|entity culling|badoptimizations|krypton|cull|flerovium|prism|fragmentum/i
      },
      {
        key: "library",
        label: "前置库与开发框架",
        tone: "var(--gray)",
        description: "API、库、配置框架、KubeJS 运行时和通用前置。",
        pattern: /lib|library|api|core|architectury|cloth config|configured defaults|kubejs|rhino|geckolib|citadel|moonlight|resourceful|puzzles|bookshelf|balm|terrablender|curios api|framework|flywheel|placebo|selene|konkrete|blueprint|caelus|cupboard|mixinextras|searchables|supermartijn642|collective|kiwi|cobweb|coroutil|iceberg|kambrik|kotlin|melody|mutil|sqlite|titanium/i
      },
      {
        key: "other",
        label: "其他扩展",
        tone: "var(--muted)",
        description: "独立玩法、工具或难以归入单一大类的兼容内容。",
        pattern: /.^/
      }
    ];

    const byId = (id) => document.getElementById(id);
    const categoryByKey = new Map(categories.map((category) => [category.key, category]));
    const state = { category: "all", side: "all", search: "" };

    function sideLabel(side) {
      if (side === "client") return "客户端";
      if (side === "server") return "服务端";
      return "双端";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function textFor(mod) {
      return `${mod.id || ""} ${mod.name || ""} ${mod.filename || ""}`;
    }

    function getCategory(mod) {
      const text = textFor(mod);
      return categories.find((category) => category.key !== "other" && category.pattern.test(text)) || categoryByKey.get("other");
    }

    const enrichedMods = mods.map((mod) => {
      const category = getCategory(mod);
      return { ...mod, category: category.key, categoryLabel: category.label };
    });

    function matchesFilters(mod) {
      const query = state.search.trim().toLowerCase();
      const searchText = `${textFor(mod)} ${mod.categoryLabel}`.toLowerCase();
      return (state.category === "all" || mod.category === state.category)
        && (state.side === "all" || mod.side === state.side)
        && (query === "" || searchText.includes(query));
    }

    function filteredMods() {
      return enrichedMods.filter(matchesFilters);
    }

    function categoryMods(categoryKey, includeFilters) {
      return enrichedMods.filter((mod) => {
        if (mod.category !== categoryKey) return false;
        if (!includeFilters) return true;
        return matchesFilters({ ...mod, category: categoryKey });
      });
    }

    function renderControls() {
      const categorySelect = byId("categorySelect");
      categorySelect.innerHTML = "";
      const allOption = document.createElement("option");
      allOption.value = "all";
      allOption.textContent = "全部分类";
      categorySelect.appendChild(allOption);
      categories.forEach((category) => {
        const option = document.createElement("option");
        option.value = category.key;
        option.textContent = category.label;
        categorySelect.appendChild(option);
      });
    }

    function renderStats(items) {
      byId("totalCount").textContent = String(items.length);
      byId("categoryCount").textContent = String(categories.length);
      byId("bothCount").textContent = String(items.filter((mod) => mod.side === "both").length);
      byId("clientCount").textContent = String(items.filter((mod) => mod.side === "client").length);
      byId("dataSummary").textContent = `基于 ${enrichedMods.length} 个 Packwiz 模组元数据`;
      const categoryText = state.category === "all" ? "全部分类" : categoryByKey.get(state.category).label;
      const sideText = state.side === "all" ? "全部端侧" : sideLabel(state.side);
      byId("filterSummary").textContent = `${categoryText} / ${sideText}`;
    }

    function renderCategories() {
      const grid = byId("categoryGrid");
      grid.innerHTML = "";
      categories.forEach((category) => {
        const totalItems = categoryMods(category.key, false);
        const visibleItems = categoryMods(category.key, true);
        const button = document.createElement("button");
        button.className = "category-card";
        button.type = "button";
        button.dataset.category = category.key;
        button.style.setProperty("--tone", category.tone);
        button.setAttribute("aria-pressed", state.category === category.key ? "true" : "false");
        const examples = totalItems.slice(0, 3).map((mod) => escapeHtml(mod.name)).join(" / ");
        button.innerHTML = `
          <span class="category-top">
            <span class="category-name">${escapeHtml(category.label)}</span>
            <span class="category-count">${visibleItems.length}</span>
          </span>
          <p>${escapeHtml(category.description)}</p>
          <span class="category-examples">${examples}</span>
        `;
        button.addEventListener("click", () => {
          state.category = state.category === category.key ? "all" : category.key;
          byId("categorySelect").value = state.category;
          render();
        });
        grid.appendChild(button);
      });
    }

    function renderSummary(items) {
      const both = items.filter((mod) => mod.side === "both").length;
      const client = items.filter((mod) => mod.side === "client").length;
      const server = items.filter((mod) => mod.side === "server").length;
      const selectedCategory = categoryByKey.get(state.category);
      byId("listTitle").textContent = selectedCategory ? selectedCategory.label : "全部模组";
      byId("summaryLine").innerHTML = `
        <span class="pill">结果 ${items.length}</span>
        <span class="pill">双端 ${both}</span>
        <span class="pill">客户端 ${client}</span>
        <span class="pill">服务端 ${server}</span>
      `;
    }

    function renderGroups(items) {
      const groups = byId("groups");
      groups.innerHTML = "";
      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "没有匹配的模组。";
        groups.appendChild(empty);
        return;
      }

      const visibleCategories = categories
        .map((category) => ({
          ...category,
          items: items
            .filter((mod) => mod.category === category.key)
            .sort((a, b) => a.name.localeCompare(b.name, "zh-CN"))
        }))
        .filter((category) => category.items.length > 0);

      visibleCategories.forEach((category) => {
        const section = document.createElement("section");
        section.className = "group";
        section.style.setProperty("--tone", category.tone);
        const modsHtml = category.items.map((mod) => {
          const sideClass = mod.side === "client" ? "client" : mod.side === "server" ? "server" : "both";
          return `
            <article class="mod-item">
              <span>
                <strong>${escapeHtml(mod.name)}</strong>
                <code>${escapeHtml(mod.filename)}</code>
              </span>
              <span class="side ${sideClass}">${sideLabel(mod.side)}</span>
            </article>
          `;
        }).join("");
        section.innerHTML = `
          <div class="group-title">
            <h3>${escapeHtml(category.label)}</h3>
            <span class="pill">${category.items.length}</span>
          </div>
          <div class="mod-grid">${modsHtml}</div>
        `;
        groups.appendChild(section);
      });
    }

    function render() {
      const items = filteredMods();
      renderStats(items);
      renderCategories();
      renderSummary(items);
      renderGroups(items);
    }

    renderControls();
    byId("searchInput").addEventListener("input", (event) => {
      state.search = event.target.value;
      render();
    });
    byId("categorySelect").addEventListener("change", (event) => {
      state.category = event.target.value;
      render();
    });
    byId("sideSelect").addEventListener("change", (event) => {
      state.side = event.target.value;
      render();
    });
    render();
  </script>
</body>
</html>
