#Whether to enable the drop report
disableDropReport = true
#Threshold for drop reporting.
#Range: > 0
itemThreshold = 100
#If this option is enabled, the drop report will be counted by a single drop entity, not by the number of items in it
ignoreStackCount = false
#Money Chain used for money calculating
moneyChain = "main"
#Whether to use money for teleporting
useMoneyTeleport = true
#Coin used for waystone teleporting per unit.
#It's the base value of the chain.
#Range: > 1
teleportCost = 45
#The chance for luna soil to boost crops grows.
#Range: 0.0 ~ 1.0
lunaSoilBoostChance = 0.5
#Whether to log More Mod Tetra independent damage multipliers.
#Useful for debugging MMT damage stacking; logs only when MMT reports at least one independent multiplier.
logMoreModTetraIndependentDamageMultipliers = true
#Backport the newer Apothic Attributes additive multicrit formula when Apothic Attributes is installed.
enableAdditiveMulticrit = true
#Make Iron's Spells Echoing Strikes record the LivingHurtEvent amount captured at event construction.
#This prevents event-based damage multipliers from being sampled once by the hit and again by the echo.
echoingStrikesUseOriginalDamage = true

