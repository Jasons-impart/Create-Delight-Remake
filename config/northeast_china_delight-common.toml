#海洋取水
[sea_water]
	#1：在海洋中取水获得海水桶。
	#2：在海洋中取水，获得带海水标记的普通水桶，功能同海水桶
	#3：不干预正常取水
	#Range: 1 ~ 3
	bucket_mode = 3

