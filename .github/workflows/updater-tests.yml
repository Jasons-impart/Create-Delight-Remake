name: Updater tests
on:
  pull_request:
    paths:
      - '.agents/skills/release/cdr-updater*/**'
      - '.github/workflows/updater-tests.yml'
  push:
    branches: [main]
    paths:
      - '.agents/skills/release/cdr-updater*/**'
      - '.github/workflows/updater-tests.yml'
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .agents/skills/release
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
        working-directory: .agents/skills/release/cdr-updater-rust
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .agents/skills/release/cdr-updater-go
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: go test ./...
        working-directory: .agents/skills/release/cdr-updater-go/server
  java:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .agents/skills/release/cdr-updater
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./build.ps1
        shell: pwsh
        working-directory: .agents/skills/release/cdr-updater
