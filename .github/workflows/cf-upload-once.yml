name: One-shot CurseForge client upload
on:
  push:
    branches: [chore/cf-upload-v0.5.0.16]
    paths: [.github/workflows/cf-upload-once.yml]
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt legacy upload with hardcoded gameVersions
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER=v0.5.0.16
          ZIP="Client-Create-Delight-Remake-${VER}.zip"
          mkdir -p release-assets
          gh release download "$VER" -R "${{ github.repository }}" -p "$ZIP" -D release-assets

          # From existing CF file metadata: gameVersions ["1.20.1","Forge"]
          # Legacy IDs commonly: 1.20.1=9990, Forge=7498 (verify via failing soft)
          METADATA=$(python3 - <<'PY'
          import json
          meta={
            "changelog": "### v0.5.0.16\n- TerrainGraph\n- Remove TrueUUID/World Preview\n- ZSTDNET fixes\n\nGH: https://github.com/Jasons-impart/Create-Delight-Remake/releases/tag/v0.5.0.16",
            "changelogType": "markdown",
            "displayName": "Client-Create-Delight-Remake-v0.5.0.16",
            "gameVersions": [9990, 7498],
            "releaseType": "release",
          }
          print(json.dumps(meta))
          PY
          )
          echo "metadata=$METADATA"
          code=$(curl -sS -o /tmp/cf-up.json -w "%{http_code}" \
            -H "X-Api-Token: ${CURSEFORGE_TOKEN}" \
            -F "metadata=${METADATA};type=application/json" \
            -F "file=@release-assets/${ZIP};type=application/zip" \
            "https://minecraft.curseforge.com/api/projects/1059094/upload-file" || echo 000)
          echo "upload HTTP $code"
          head -c 500 /tmp/cf-up.json; echo
          if [ "$code" = "200" ]; then
            python3 -c 'import json;d=json.load(open("/tmp/cf-up.json"));print("FILE_ID",d.get("id"));print("URL",d)'
            exit 0
          fi
          echo "UPLOAD_FAILED token_type_or_api"
          exit 1
