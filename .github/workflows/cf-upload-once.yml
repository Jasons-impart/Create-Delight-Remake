name: One-shot CurseForge client upload
on:
  push:
    branches: [chore/cf-upload-v0.5.0.16]
    paths: [.github/workflows/cf-upload-once.yml]
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download Client zip from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER=v0.5.0.16
          mkdir -p release-assets
          gh release download "$VER" -R "${{ github.repository }}" \
            -p "Client-Create-Delight-Remake-${VER}.zip" \
            -D release-assets
          ls -lh release-assets/
          test -f "release-assets/Client-Create-Delight-Remake-${VER}.zip"
      - name: Upload to CurseForge
        id: cf
        uses: henkelmax/upload-curseforge-modpack-action@v1.0.0
        with:
          api-token: ${{ secrets.CURSEFORGE_TOKEN }}
          project-id: "1059094"
          modpack-path: release-assets/Client-Create-Delight-Remake-v0.5.0.16.zip
          display-name: Client-Create-Delight-Remake-v0.5.0.16
          game-version: "1.20.1"
          release-type: release
          changelog: |
            ### v0.5.0.16 已发布
            - 添加TerrainGraph优化生成
            - 移除TrueUUID与世界预览
            - 更新ZSTDNET并修多项问题

            GitHub Release: https://github.com/Jasons-impart/Create-Delight-Remake/releases/tag/v0.5.0.16
          changelog-format: markdown
